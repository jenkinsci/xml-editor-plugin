<div>Ant pattern(s), comma separated, selecting several files to edit with the same operations, e.g. <code>**/*.csproj</code>. All files are edited in memory first: if an operation fails on any file, no file is written. <code>expected</code> is checked for each file. Use exactly one of <code>file</code> or <code>files</code>: setting both is an error.</div>
